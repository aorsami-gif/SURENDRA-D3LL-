<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Surendra Beatdown 3D Arcade</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b12;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }
        .score-board {
            background: rgba(15, 15, 25, 0.9);
            border: 2px solid #ff3366;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.4);
            color: #fff;
            text-align: center;
        }
        .score-board h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 2px;
            color: #ff3366;
        }
        .score-board p {
            margin: 5px 0 0 0;
            font-size: 22px;
            font-weight: bold;
        }
        .health-container {
            width: 280px;
            background: rgba(20, 20, 30, 0.95);
            border: 2px solid #00ffff;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }
        .character-name-tag {
            color: #ffff00;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.6);
            display: flex;
            justify-content: space-between;
        }
        .health-bar-bg {
            width: 100%;
            height: 18px;
            background: #222;
            border-radius: 9px;
            overflow: hidden;
            border: 1px solid #555;
        }
        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff3366, #ff9933);
            transition: width 0.1s ease-out;
        }
        #announcement {
            position: absolute;
            top: 32%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 34px;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 0 0 25px rgba(255, 255, 0, 0.9), 2px 2px 0px #000;
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s;
            opacity: 0;
            text-align: center;
            z-index: 10;
        }
        .controls-hint {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 18px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            align-self: center;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            pointer-events: auto;
            margin-bottom: 10px;
        }
        .punch-btn {
            background: linear-gradient(135deg, #ff3366, #cc0033);
            border: none;
            color: white;
            padding: 20px 28px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(255, 51, 102, 0.5);
            cursor: pointer;
            transition: transform 0.1s, filter 0.1s;
            pointer-events: auto;
        }
        .punch-btn:active {
            transform: scale(0.92);
            filter: brightness(1.2);
        }
        #audio-prompt {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
            color: white;
            text-align: center;
            padding: 20px;
        }
        #audio-prompt button {
            background: linear-gradient(135deg, #00ffff, #0088ff);
            border: none;
            color: #000;
            font-size: 22px;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            margin-top: 20px;
            transition: transform 0.2s;
        }
        #audio-prompt button:hover {
            transform: scale(1.05);
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="audio-prompt">
        <h1 style="color: #ff3366; text-shadow: 0 0 15px rgba(255,51,102,0.8); margin-bottom: 10px;">SURENDRA BEATDOWN 3D</h1>
        <p style="max-width: 400px; color: #ccc; line-height: 1.5;">Tap below to start the game with full audio, 3D graphics, and action buttons!</p>
        <button id="start-game-btn">START GAME</button>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-header">
            <div class="score-board">
                <h1>SCORE</h1>
                <p id="score-val">0</p>
            </div>
            <div class="health-container">
                <div class="character-name-tag">
                    <span>🔥 SURENDRA</span>
                    <span id="hp-val">500/500</span>
                </div>
                <div class="health-bar-bg">
                    <div id="hp-fill" class="health-bar-fill"></div>
                </div>
            </div>
        </div>

        <div id="announcement">NICE HIT!</div>

        <div style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
            <div class="controls-hint">Tap Buttons Below or Press J / K / L on Keyboard</div>
            <div class="action-buttons">
                <button class="punch-btn" id="btn-jab">JAB (J)</button>
                <button class="punch-btn" id="btn-hook" style="background: linear-gradient(135deg, #ff9933, #cc5500);">HOOK (K)</button>
                <button class="punch-btn" id="btn-uppercut" style="background: linear-gradient(135deg, #00ffff, #0088cc); color: #000;">UPPERCUT (L)</button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, surendraGroup;
        let head, torso, leftArm, rightArm, leftLeg, rightLeg;
        let audioCtx = null;
        let score = 0;
        let maxHP = 500;
        let surendraHP = 500;
        let isKnockedOut = false;
        let animTimer = 0;

        const cheers = [
            "LET'S GO!", "OOF!", "FATALITY!", "BOOM!", "CRITICAL HIT!", "DESTROYED!", "BURST!", "SAVAGE!"
        ];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playPunchSound(type) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let freq = 140;
            let duration = 0.18;

            if (type === 'jab') {
                freq = 180;
                duration = 0.12;
            } else if (type === 'hook') {
                freq = 110;
                duration = 0.22;
            } else if (type === 'uppercut') {
                freq = 240;
                duration = 0.3;
            }

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + duration);

            gain.gain.setValueAtTime(1.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0b0b12, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.8, 4.5);
            camera.lookAt(0, 1.1, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
            dirLight.position.set(3, 8, 4);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const blueLight = new THREE.PointLight(0x00ffff, 2.5, 10);
            blueLight.position.set(-3, 2, 2);
            scene.add(blueLight);

            const pinkLight = new THREE.PointLight(0xff3366, 2.5, 10);
            pinkLight.position.set(3, 2, 2);
            scene.add(pinkLight);

            // Stage Floor
            const floorGeo = new THREE.CylinderGeometry(4, 4.2, 0.4, 32);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.3, metalness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.2;
            floor.receiveShadow = true;
            scene.add(floor);

            createSurendraModel();

            window.addEventListener('resize', onWindowResize);
        }

        function createSurendraModel() {
            surendraGroup = new THREE.Group();
            scene.add(surendraGroup);

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.6 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x223344, roughness: 0.5 });
            const jeansMat = new THREE.MeshStandardMaterial({ color: 0x1d3557, roughness: 0.7 });

            // Torso
            const torsoGeo = new THREE.BoxGeometry(0.8, 1.1, 0.45);
            torso = new THREE.Mesh(torsoGeo, shirtMat);
            torso.position.y = 1.15;
            torso.castShadow = true;
            surendraGroup.add(torso);

            // Head & Face Group (Clean alignment to prevent stick artifacts)
            const headGeo = new THREE.BoxGeometry(0.5, 0.55, 0.5);
            head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 1.95;
            head.castShadow = true;
            surendraGroup.add(head);

            // Hair
            const hairGeo = new THREE.BoxGeometry(0.52, 0.2, 0.52);
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.set(0, 0.2, 0);
            head.add(hair);

            // Limbs (Properly positioned)
            const armGeo = new THREE.BoxGeometry(0.22, 0.85, 0.22);
            
            leftArm = new THREE.Mesh(armGeo, skinMat);
            leftArm.position.set(-0.52, 1.15, 0.1);
            leftArm.castShadow = true;
            surendraGroup.add(leftArm);

            rightArm = new THREE.Mesh(armGeo, skinMat);
            rightArm.position.set(0.52, 1.15, 0.1);
            rightArm.castShadow = true;
            surendraGroup.add(rightArm);

            const legGeo = new THREE.BoxGeometry(0.32, 1.0, 0.32);
            
            leftLeg = new THREE.Mesh(legGeo, jeansMat);
            leftLeg.position.set(-0.22, 0.45, 0);
            leftLeg.castShadow = true;
            surendraGroup.add(leftLeg);

            rightLeg = new THREE.Mesh(legGeo, jeansMat);
            rightLeg.position.set(0.22, 0.45, 0);
            rightLeg.castShadow = true;
            surendraGroup.add(rightLeg);
        }

        function triggerHit(type) {
            if (isKnockedOut) return;

            playPunchSound(type);

            const damage = type === 'uppercut' ? 45 : type === 'hook' ? 30 : 20;
            score += damage;
            surendraHP -= damage;
            if (surendraHP < 0) surendraHP = 0;

            document.getElementById('score-val').innerText = score;
            document.getElementById('hp-val').innerText = surendraHP + '/' + maxHP;
            const hpPercent = (surendraHP / maxHP) * 100;
            document.getElementById('hp-fill').style.width = hpPercent + '%';

            // Cheer Announcement
            const ann = document.getElementById('announcement');
            ann.innerText = cheers[Math.floor(Math.random() * cheers.length)];

            ann.style.opacity = '1';
            setTimeout(() => {

                ann.style.opacity = '0';
            }, 300);

                surend
